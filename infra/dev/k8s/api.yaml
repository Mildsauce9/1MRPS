apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: 1mrps-api
          ports:
            - containerPort: 8080
          env:
            - name: GOOSE_DBSTRING
              value: postgres://postgres:postgres@postgres:5432/game?sslmode=disable
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: api}
  ports:
    - port: 8080
